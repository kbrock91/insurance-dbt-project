sources:
  zna:
    type: snowflake
    account: "{{ env_var('DCT_ZNA_ACCOUNT', 'unused') }}"
    user: "{{ env_var('DCT_ZNA_USER', 'readonly') }}"
    password: "{{ env_var('DCT_ZNA_PASSWORD', 'unused') }}"
    database: "{{ env_var('DCT_ZNA_DATABASE', 'analytics') }}"
    warehouse: "{{ env_var('DCT_ZNA_WAREHOUSE', 'compute_wh') }}"
