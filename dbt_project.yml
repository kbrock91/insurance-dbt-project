name: "insurance_dbt"
version: "1.0.0"
config-version: 2

profile: "insurance_dbt_zna"

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]

flags:
  use_v2_parser: true

models:
  insurance_dbt:
    +state:
      compare_unrendered_code: true
      lag_tolerance: 5m
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: table
    marts:
      +materialized: table
    synthetic:
      +enabled: false
      +materialized: table

seeds:
  insurance_dbt:
    +quote_columns: false

sources:
  +freshness:
    warn_after:
      count: 9999
      period: day

tests:
  +static_analysis: strict 