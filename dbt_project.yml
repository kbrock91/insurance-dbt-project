name: "insurance_dbt"
version: "1.0.0"
config-version: 2

profile: "insurance_dbt"

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]

models:
  insurance_dbt:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    marts:
      +materialized: table
  dbt_pov_model_cost_calculator:
    +schema: kb_pov_model_cost_calculator

seeds:
  insurance_dbt:
    +quote_columns: false

# ----------------------------------------------
# dbt-pov-model-cost-calculator configuration
# ----------------------------------------------

vars:
  # Optional: restrict reporting window to recent runs
  dbt_pov_model_cost_calculator:
    model_monitor_start_date: '2025-12-08'

query-comment: "{{ dbt_pov_model_cost_calculator.query_comment(node) }}"


  