version: 2

models:
  - name: stg_agencies
    data_tests:
    - is_valid_channel:
        config: 
          severity: warn
          group: claims
    columns:
      - name: agency_id
        data_tests:
          - unique
      - name: channel_type
  - name: stg_policyholders
  - name: stg_products
  - name: stg_policies
  - name: stg_vehicles
  - name: stg_claims
    columns:
      - name: claim_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['open', 'closed', 'new', 'under_review','in_progress', 'canceled']
              config:
                severity: warn
                meta: 
                  error_message: "Claim status must be one of the following: open, closed, new, under_review, in_progress, canceled, cancelled"
      - name: claim_id
        data_tests:
          - unique
          - not_null
      - name: policy_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_policies')
                field: policy_id
      - name: report_date
        data_tests:
          - not_null
      - name: incident_date
        data_tests:
          - not_null
      - name: claim_cause
        data_tests:
          - not_null
      - name: loss_amount
        data_tests:
          - not_null
  - name: stg_claim_payouts

unit_tests:
  - name: stg_policyholders_phone_format
    model: stg_policyholders
    given:
      - input: source('raw_insurance', 'policyholders')
        rows:
          - phone: '206-777-1212'
          - phone: '(312)555.9988'
          - phone: '646 555 4321'
    expect:
      rows:
        - phone: '(206) 777-1212'
        - phone: '(312) 555-9988'
        - phone: '(646) 555-4321'
