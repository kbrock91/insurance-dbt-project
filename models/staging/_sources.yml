version: 2

sources:
  - name: raw_insurance
    database: analytics
    schema: dbt_kbrock_insurance
    description: Raw insurance data loaded from seed files

    tables:
      - name: adjusters
        description: Insurance claim adjusters who investigate and process claims.
      - name: agencies
        description: Master list of insurance agencies.
      - name: claim_payouts
        description: Payments made for claims.
      - name: claims
        description: Reported claims against policies.
      - name: policies
        description: Policies tying policyholders, agencies, products, and vehicles.
      - name: policyholders
        description: Individual customers who hold insurance policies.
      - name: premiums
        description: Premium transactions by policy and effective date.
      - name: products
        description: Insurance product catalog.
      - name: vehicles
        description: Vehicles covered by policies.
      - name: underwriting_decisions
        description: Underwriting decision records for policy applications.
      - name: claim_notes
        description: Adjuster notes and updates for claims.
